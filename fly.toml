app = "learn-chinese"
primary_region = "iad"
swap_size_mb = 512

[env]
  NODE_ENV = "production"

[mounts]
  source = "data"
  destination = "/data"

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/"
  timeout = "5s"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 100
